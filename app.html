<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clausa — App</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700;800&family=Inter:wght@400;500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.95.0/dist/umd/supabase.js"></script>
<script src="js/clausa-config.js"></script>
<style>
:root{
  --paper:#0B0B0C;--panel:#0E0E0F;--card:#161617;--card2:#1D1D1F;--ink:#FAFAFA;--gray:#9B9B9E;--line:#2A2A2D;
  --orange:#FF8A33;--orange-deep:#E2590B;
  --alto:#F0625A;--medio:#E0B65C;--ok:#5FB58C;
  --glow-a:rgba(255,122,26,.24);--glow-b:rgba(226,89,11,.18);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;position:relative;z-index:0;background:var(--paper);color:var(--ink);font:400 15px/1.55 "Inter",system-ui,sans-serif;overflow:hidden}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(55% 45% at 50% 6%,var(--glow-a),transparent 72%),radial-gradient(48% 42% at 85% 56%,var(--glow-b),transparent 70%),radial-gradient(44% 42% at 13% 88%,var(--glow-a),transparent 72%)}
@keyframes glow-breathe{0%,100%{opacity:.8;transform:translateY(0)}50%{opacity:1;transform:translateY(-16px)}}
@keyframes grad-slide{to{background-position:200% 0}}
.find,.contract-txt{position:relative;overflow:hidden}
@media (prefers-reduced-motion:no-preference){body::after{animation:glow-breathe 18s ease-in-out infinite}}
h1,h2,h3{font-family:"Inter Tight","Inter",system-ui,sans-serif;font-weight:800;letter-spacing:-.025em;margin:0;line-height:1.12}
.scales{color:var(--orange);flex:none}
.btn{font:600 14px "Inter",sans-serif;border:0;border-radius:10px;padding:10px 16px;background:var(--orange-deep);color:#fff;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:transform .15s,filter .15s}
.btn:hover{transform:translateY(-1px);filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:7px 12px;font-size:13px}
.btn.tiny{padding:5px 10px;font-size:12px;border-radius:8px}
.mut{color:var(--gray)}.small{font-size:13px}

.app{display:flex;height:100%;height:100dvh;overflow:hidden}

/* ---- Sidebar ---- */
.side{position:relative;width:286px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.side-top{padding:16px 16px 10px}
.logo{display:flex;align-items:center;gap:9px;font-family:"Inter Tight","Inter",sans-serif;font-weight:800;letter-spacing:-.03em;font-size:22px;color:var(--ink);text-decoration:none;margin-bottom:14px}
.logo .scales{width:23px;height:23px}
#new{width:100%}
.convos{flex:1;overflow-y:auto;padding:6px 10px}
.clabel{font:600 11px "Inter";letter-spacing:.08em;text-transform:uppercase;color:var(--gray);padding:12px 8px 6px}
.cfilter{display:flex;flex-wrap:wrap;gap:5px;padding:0 2px 8px}
.cfilter .fchip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:none;color:var(--gray);font:600 11px "Inter";padding:4px 9px;border-radius:20px;cursor:pointer;transition:color .15s,border-color .15s,background .15s}
.cfilter .fchip:hover{color:var(--ink)}
.cfilter .fchip.on{background:var(--card);color:var(--ink);border-color:var(--orange)}
.cfilter .fchip .fdot{width:7px;height:7px;border-radius:50%}
.convo{display:flex;align-items:center;gap:8px;padding:10px 10px;border-radius:9px;cursor:pointer;color:var(--ink);font-size:14px;margin-bottom:2px;transition:background .15s}
.convo .cmenu{transition:opacity .15s,background .15s,color .15s}
.convo:hover{background:var(--card)}
.convo.active{background:var(--card);outline:1px solid var(--line)}
.convo .ci{width:15px;height:15px;flex:none;color:var(--orange)}
.convo .ct{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.convo .cx{opacity:0;border:0;background:none;color:var(--gray);cursor:pointer;font-size:16px;line-height:1;padding:2px 4px;border-radius:5px}
.convo:hover .cx{opacity:1}.convo .cx:hover{color:var(--alto);background:var(--paper)}
.convo .cdot{width:8px;height:8px;border-radius:50%;flex:none}
.convo .cpin{width:13px;height:13px;flex:none;color:var(--orange)}
.convo .cmenu{opacity:0;border:0;background:none;color:var(--gray);cursor:pointer;font-size:17px;line-height:1;padding:2px 6px;border-radius:5px;flex:none}
.convo:hover .cmenu,.convo.active .cmenu{opacity:1}
.convo .cmenu:hover{color:var(--ink);background:var(--paper)}
@media (hover:none){.convo .cmenu{opacity:1}}
.cmenupop{position:fixed;z-index:200;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 34px rgba(0,0,0,.55);padding:6px;min-width:200px;
  animation:menu-in .2s cubic-bezier(.2,.85,.25,1)}
.cmenupop.closing{animation:menu-out .13s ease-in forwards;pointer-events:none}
.cmenupop>*{animation:item-in .26s cubic-bezier(.2,.85,.25,1) both;animation-delay:calc(var(--i,0) * 16ms + 30ms)}
@keyframes menu-in{from{opacity:0;transform:scale(.92) translateY(-6px)}to{opacity:1;transform:none}}
@keyframes menu-out{to{opacity:0;transform:scale(.96) translateY(-3px)}}
@keyframes item-in{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
.convo .cmenu.on{opacity:1;color:var(--ink);background:var(--paper)}
.cmenupop button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:0;color:var(--ink);cursor:pointer;padding:8px 10px;border-radius:7px;font:500 13px "Inter";transition:background .15s,transform .15s}
.cmenupop button:active{transform:scale(.98)}
.cmenupop button:hover{background:var(--paper)}
.cmenupop .sep{height:1px;background:var(--line);margin:5px 4px}
.cmenupop .lbl{font:600 10.5px "Inter";letter-spacing:.06em;text-transform:uppercase;color:var(--gray);padding:6px 10px 3px}
.cmenupop .dot{width:9px;height:9px;border-radius:50%;flex:none}
.cmenupop .del{color:var(--alto)}
.side-foot{border-top:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:6px}
.side-foot button,.side-foot a{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;color:var(--gray);font:500 13px "Inter";cursor:pointer;text-decoration:none;padding:8px 10px;border-radius:8px}
.side-foot button:hover,.side-foot a:hover{background:var(--card);color:var(--ink)}
.side-acct{display:flex;align-items:center;gap:8px;padding:6px 10px 10px;margin-bottom:4px;border-bottom:1px solid var(--line)}
.side-acct .acct-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.side-acct .acct-nm{font:600 13px "Inter";color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-acct .acct-em{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:400 11px "Inter";color:var(--gray)}
.side-acct .acct-out{flex:none;background:none;border:1px solid var(--line);color:var(--gray);font:600 11.5px "Inter";cursor:pointer;padding:5px 10px;border-radius:7px;width:auto}
.side-acct .acct-out:hover{background:var(--card);color:var(--ink)}
.side-acct .acct-login{display:flex;align-items:center;gap:8px;width:100%;color:var(--orange);font:600 12.5px "Inter";text-decoration:none;padding:4px 0}
.side-acct .acct-login:hover{text-decoration:underline;background:none}

/* ---- Main ---- */
.main{flex:1;display:flex;flex-direction:column;min-width:0;padding-top:env(safe-area-inset-top,0px)}
.main-top{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);min-height:56px}
.menu-btn{display:none;background:none;border:0;color:var(--ink);cursor:pointer;font-size:20px;padding:4px}
.main-top .mt{font-weight:600;font-size:15px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scroll{flex:1;overflow-y:auto;padding:24px 20px}
.inner{max-width:760px;margin:0 auto}

/* saudação */
.greet{min-height:52vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px}
.greet .scales{width:46px;height:46px}
.greet h1{font-size:clamp(28px,4.5vw,40px)}
.greet p{color:var(--gray);max-width:46ch;margin:0}
.chips{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:6px}

/* mensagens */
.msg{display:flex;gap:12px;margin-bottom:22px}
.ava{width:30px;height:30px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px}
.ava.you{background:var(--card2);color:var(--ink);border:1px solid var(--line)}
.ava.you .quill{color:var(--ink);width:17px;height:17px}
.msg.you{flex-direction:row-reverse}
.msg.you .mbody{display:flex;flex-direction:column;align-items:flex-end}
.msg.you .mname{text-align:right}
.msg.you .contract-txt{max-width:88%}
.msg.you .cexpand{align-self:flex-end}
.ava.ai{background:rgba(255,138,51,.14);border:1px solid rgba(255,138,51,.35)}
.ava.ai .scales{width:18px;height:18px}
.mbody{flex:1;min-width:0}
.mname{font-weight:600;font-size:13px;margin-bottom:5px}
.aireveal{opacity:0;transform:translateY(8px);transition:opacity .55s ease,transform .55s cubic-bezier(.2,.7,.2,1)}
.aireveal.show{opacity:1;transform:none}
.thinking{display:flex;align-items:center;gap:9px;color:var(--gray);font-size:14px}
.dots{display:inline-flex;gap:4px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--orange);display:inline-block;animation:bd 1s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bd{0%,60%,100%{transform:translateY(0);opacity:.35}30%{transform:translateY(-5px);opacity:1}}
.contract-txt{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:13.5px;white-space:pre-wrap;max-height:150px;overflow:hidden;position:relative}
.contract-txt.open{max-height:none}
.cexpand{background:none;border:0;color:var(--orange);font:500 12px "Inter";cursor:pointer;padding:6px 0 0}

.sumbar{display:flex;gap:10px;flex-wrap:wrap;margin:4px 0 16px}
.stat{flex:1 1 84px;background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:10px 13px}
.stat b{display:block;font:800 24px "Inter Tight","Inter",sans-serif;letter-spacing:-.02em}
.stat.alto b{color:var(--alto)}.stat.medio b{color:var(--medio)}.stat.ok b{color:var(--ok)}.stat.apr b{color:var(--orange)}
.stat span{font-size:11.5px;color:var(--gray)}
.find{border:1px solid var(--line);border-left:3px solid var(--line);border-radius:10px;padding:13px;margin-bottom:11px;background:var(--card2)}
.find.alto{border-left-color:var(--alto)}.find.medio{border-left-color:var(--medio)}.find.ok{border-left-color:var(--ok)}
.find .fh{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.sev{font:600 11px "Inter";border-radius:30px;padding:3px 9px;white-space:nowrap;border:1px solid transparent}
.sev.alto{color:var(--alto);border-color:rgba(240,98,90,.4);background:rgba(240,98,90,.12)}
.sev.medio{color:var(--medio);border-color:rgba(224,182,92,.4);background:rgba(224,182,92,.12)}
.sev.ok{color:var(--ok);border-color:rgba(95,181,140,.4);background:rgba(95,181,140,.12)}
.find .ft{font-weight:600}
.find q{display:block;margin:9px 0;padding:8px 11px;border-left:2px solid var(--line);color:var(--gray);font-style:italic;font-size:13px}
.find .why{font-size:13px;color:var(--gray)}
.sugg{margin-top:11px;background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:11px}
.sugg .sl{font:600 11px "Inter";letter-spacing:.08em;text-transform:uppercase;color:var(--orange)}
.sugg.note-ok .sl{color:var(--ok)}
.sugg p{margin:5px 0 0;font-size:13px}
.sugg .sa{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.state{font:600 12px "Inter";padding:3px 9px;border-radius:30px}
.state.apr{color:var(--ok);background:rgba(95,181,140,.14)}.state.rej{color:var(--alto);background:rgba(240,98,90,.14)}
.find.rej{opacity:.6}

/* composer */
.composer{border-top:1px solid var(--line);padding:14px 20px calc(16px + env(safe-area-inset-bottom,0px))}
.cwrap{max-width:760px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 10px 10px 16px;display:flex;align-items:flex-end;gap:10px;transition:border-color .2s}
.cwrap:focus-within{border-color:var(--orange)}
#input{flex:1;min-width:0;border:0;background:none;color:var(--ink);font:400 14.5px/1.5 "Inter";resize:none;max-height:180px;padding:7px 0}
#input:focus{outline:0}
#send{flex:none;width:40px;height:40px;border-radius:11px;background:var(--orange-deep);border:0;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center}
#send:disabled{opacity:.4;cursor:default}
.chint{max-width:760px;margin:8px auto 0;text-align:center;font-size:12px;color:var(--gray)}

/* drawer regras */
/* fundos escurecidos: aparecem e somem com fade (display:none não anima) */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;opacity:0;visibility:hidden;transition:opacity .28s ease,visibility 0s linear .28s}
.overlay.open{opacity:1;visibility:visible;transition:opacity .28s ease}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(440px,92vw);background:var(--panel);border-left:1px solid var(--line);z-index:70;transform:translateX(100%);transition:transform .34s cubic-bezier(.22,.85,.25,1),box-shadow .34s;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.drawer.open{transform:none;box-shadow:-24px 0 60px rgba(0,0,0,.45)}
.rule.open .rdet{animation:fade-down .22s cubic-bezier(.2,.85,.25,1)}
@keyframes fade-down{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

/* janela de confirmação do Clausa (no lugar das caixas do navegador) */
.modal{position:fixed;inset:0;z-index:300;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.6);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
  opacity:0;visibility:hidden;transition:opacity .22s ease,visibility 0s linear .22s}
.modal.open{opacity:1;visibility:visible;transition:opacity .22s ease}
.mcard{position:relative;width:min(420px,100%);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 22px 18px;box-shadow:0 24px 70px rgba(0,0,0,.65);
  transform:translateY(14px) scale(.96);opacity:.6;transition:transform .3s cubic-bezier(.2,.85,.25,1),opacity .2s}
.mcard::before{content:"";position:absolute;left:18px;right:18px;top:0;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,var(--orange),transparent)}
.mcard.danger::before{background:linear-gradient(90deg,transparent,var(--alto),transparent)}
.modal.open .mcard{transform:none;opacity:1}
.mico{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:rgba(255,138,51,.12);border:1px solid rgba(255,138,51,.32);color:var(--orange);margin-bottom:14px}
.mico svg{width:20px;height:20px}
.mcard.danger .mico{background:rgba(240,98,90,.12);border-color:rgba(240,98,90,.36);color:var(--alto)}
.mcard h3{font-size:21px;margin:0 0 6px}
.mcard p{color:var(--gray);font-size:14px;margin:0;line-height:1.5}
.mcard p b{color:var(--ink);font-weight:600}
.mcard input{width:100%;margin-top:14px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);font:400 14.5px "Inter";transition:border-color .15s}
.mcard input:focus{outline:0;border-color:var(--orange)}
.mact{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.btn.danger{background:var(--alto);color:#1c0907}
@media (max-width:520px){.modal{align-items:flex-end;padding:12px 12px calc(12px + env(safe-area-inset-bottom,0px))}.mact .btn{flex:1}}
.drawer .dh{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.drawer .dh h2{font-size:18px;flex:1}
.drawer .db{flex:1;overflow-y:auto;padding:16px 18px}
.rule{border:1px solid var(--line);border-radius:11px;padding:11px 12px;margin-bottom:9px;background:var(--card2)}
.rule.off{opacity:.5}
.rule .rh{display:flex;align-items:center;gap:10px}
.rule .rh .nm{font-weight:600;font-size:14px;flex:1;min-width:0}
.sw{position:relative;width:38px;height:22px;flex:none;cursor:pointer}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw i{position:absolute;inset:0;background:var(--line);border-radius:30px;transition:.2s}
.sw i::before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.sw input:checked+i{background:var(--orange-deep)}.sw input:checked+i::before{transform:translateX(16px)}
.rdet{margin-top:9px;font-size:12.5px;color:var(--gray);display:none}
.rule.open .rdet{display:block}.rdet div{margin-top:5px}.rdet b{color:var(--ink);font-weight:500}
.rtoggle{background:none;border:0;color:var(--orange);font:500 12px "Inter";cursor:pointer;padding:6px 0 0}
.field{margin:8px 0}.field label{display:block;font-size:12px;color:var(--gray);margin-bottom:3px}
.field input,.field select,.field textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);font:400 13px "Inter"}
.field textarea{min-height:50px;resize:vertical}
.tpl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:9px}
.tpl select,.tpl input{flex:1 1 130px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);font:400 13px "Inter"}
.sec-ttl{font:600 12px "Inter";letter-spacing:.06em;text-transform:uppercase;color:var(--gray);margin:18px 0 8px}

.navshade{display:none}
/* ✕ para fechar o menu lateral: escondido por padrão, aparece só no celular (regra da media query abaixo) */
.navclose{display:none;position:absolute;z-index:3;top:calc(12px + env(safe-area-inset-top,0px));right:10px;width:36px;height:36px;align-items:center;justify-content:center;background:none;border:0;border-radius:9px;color:var(--gray);font-size:20px;cursor:pointer}
.navclose:hover{background:var(--card);color:var(--ink)}
@media (max-width:760px){
  .msg:not(.you)>.ava.ai{display:none}

  .side{position:fixed;z-index:65;height:100%;transform:translateX(-100%);transition:transform .34s cubic-bezier(.22,.85,.25,1),box-shadow .34s}
  .app.nav-open .side{transform:none;box-shadow:24px 0 60px rgba(0,0,0,.5)}
  .menu-btn{display:flex}
  /* fundo escurecido atrás do menu lateral: tocar nele fecha o menu */
  .navshade{display:block;position:fixed;inset:0;z-index:64;background:rgba(0,0,0,.55);opacity:0;visibility:hidden;transition:opacity .28s ease,visibility 0s linear .28s}
  .app.nav-open .navshade{opacity:1;visibility:visible;transition:opacity .28s ease}
  .navclose{display:flex}
  /* itens do menu entram em cascata quando ele abre */
  .app.nav-open .side-top,.app.nav-open .convos,.app.nav-open .side-foot{animation:item-in .4s cubic-bezier(.2,.85,.25,1) both}
  .app.nav-open .convos{animation-delay:.05s}.app.nav-open .side-foot{animation-delay:.1s}
}
.menu-btn{transition:transform .2s}.menu-btn:active{transform:scale(.9)}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-delay:0s!important;transition-duration:.001ms!important;transition-delay:0s!important}
}
</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0B0B0C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Clausa">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="img/icones/apple-touch-icon.png">
<script src="js/instalar.js" defer></script>
</head>
<body>

<div class="app" id="app">
  <aside class="side" id="side">
    <button class="navclose" id="navclose" aria-label="Fechar menu">✕</button>
    <div class="side-top">

<script>
(function(){

  function greetings(){var n=NAME?(", "+NAME):"";return ["O que temos hoje"+n+"?","Qual o novo contrato"+n+"?","Vamos revisar algo"+n+"?","Por onde começamos"+n+"?"];}

  var DEFAULTS=[
    {id:"r1",on:true,sev:"alto",name:"Multa e cláusula penal",pat:"multa|penalidade|cl[áa]usula penal",reason:"Penalidades podem ser elevadas; confira o percentual, a base de cálculo e a proporcionalidade.",sugg:"Rever o valor da multa e vinculá-la à gravidade do descumprimento, evitando percentuais sobre o saldo total."},
    {id:"r2",on:true,sev:"medio",name:"Rescisão",pat:"rescis|resili|distrat",reason:"Verifique as hipóteses de rescisão, prazos de aviso e consequências para cada parte.",sugg:"Equilibrar as hipóteses de rescisão entre as partes e prever prazo de aviso razoável."},

    {id:"r4",on:true,sev:"medio",name:"Renovação / prorrogação",pat:"renov|prorrog",reason:"Renovação automática faz o contrato se estender sozinho; controle a data de aviso.",sugg:"Registrar a data-limite de aviso e avaliar um prazo de renovação mais curto."},
    {id:"r23",on:true,sev:"alto",name:"Não concorrência",pat:"n[ãa]o concorr|non.?compete|n[ãa]o poder[áa][^.;]{0,40}(concorr|atuar no mesmo|exercer atividade)",reason:"Proíbe uma das partes de atuar no mesmo ramo; pode limitar o trabalho por anos depois do fim do contrato.",sugg:"Limitar a não concorrência em prazo, território e atividade, e prever compensação por ela."},
    {id:"r24",on:true,sev:"alto",name:"Fiança / devedor solidário",pat:"fiador|fian[çc]a|devedor solid|solidariamente respons",reason:"Alguém passa a responder com o próprio patrimônio pela dívida de outra pessoa.",sugg:"Conferir quem é o fiador ou devedor solidário, até quando vale a garantia e se há renúncia ao benefício de ordem."},

    {id:"r26",on:true,sev:"medio",name:"Encargos por atraso",pat:"juros de mora|juros morat|multa morat|encargos morat|em caso de atraso|atraso no pagamento",reason:"Define juros, multa e correção em caso de atraso; os valores somados podem pesar.",sugg:"Conferir o percentual da multa por atraso, a taxa de juros e o índice de correção."},
    {id:"r27",on:true,sev:"medio",name:"Arbitragem",pat:"arbitragem|arbitral|c[âa]mara de (media|arbitr)",reason:"Disputas vão para um árbitro, fora do Judiciário; costuma ser mais rápido, mas pode custar caro.",sugg:"Avaliar se a arbitragem faz sentido para o valor do contrato e quem paga os custos do procedimento."},
    {id:"r28",on:true,sev:"medio",name:"Cessão do contrato",pat:"\\bceder\\b|\\bcess[ãa]o\\b|transferir[^.;]{0,30}(contrato|direitos|obriga)|subcontrat",reason:"Permite que uma parte passe o contrato ou as obrigações para terceiros.",sugg:"Exigir concordância prévia e por escrito para qualquer cessão ou subcontratação."},
    {id:"r22",on:true,sev:"medio",name:"Irrevogável e irretratável",pat:"irrevog|irretrat",reason:"Impede que as partes desistam ou voltem atrás por conta própria. O descumprimento ainda permite rescindir, mas a saída fica mais difícil.",sugg:"Avaliar se a irrevogabilidade é necessária para este negócio e prever hipóteses claras de saída."},
    {id:"r5",on:true,sev:"medio",name:"Limitação de responsabilidade",pat:"limita[^.;]{0,50}responsab|responsab[^.;]{0,60}limitad|isen[çc][ãa]o de responsab",reason:"Define o teto de indenização; confira se é compatível com o risco.",sugg:"Rever o teto e excluir dolo, culpa grave e violação de sigilo do limite."},
    {id:"r6",on:true,sev:"medio",name:"Reajuste de preço",pat:"reajust|corre[çc][ãa]o monet|[íi]ndice",reason:"Confirme o índice, a periodicidade e se há teto ou piso.",sugg:"Fixar índice claro (ex.: IPCA), periodicidade anual e, se possível, um teto."},
    {id:"r7",on:true,sev:"medio",name:"Aviso prévio",pat:"aviso pr[ée]vio|notifica[çc][ãa]o pr[ée]via",reason:"Prazo que deve ser controlado em calendário para não perder direitos.",sugg:"Registrar o prazo de aviso prévio no calendário de obrigações."},
    {id:"r8",on:true,sev:"medio",name:"Proteção de dados (LGPD)",pat:"lgpd|dados pessoais|prote[çc][ãa]o de dados|titular dos dados",reason:"O tratamento de dados pessoais exige base legal, finalidade e segurança definidas.",sugg:"Incluir cláusula de LGPD com base legal, finalidade, prazo de retenção e responsabilidades."},
    {id:"r9",on:true,sev:"medio",name:"Propriedade intelectual",pat:"propriedade intelectual|direitos autorais|titularidade|marca registrada|patente",reason:"Defina a quem pertencem os direitos sobre o que for criado ou utilizado.",sugg:"Deixar expressa a titularidade da propriedade intelectual e as licenças de uso."},
    {id:"r10",on:true,sev:"ok",name:"Prazo e vigência",pat:"vig[êe]ncia|prazo determinad|prazo indeterminad|prazo de vig",reason:"Confira início, duração e se é por prazo determinado ou indeterminado.",sugg:"Confirmar a data de início e o prazo total da vigência."},
    {id:"r11",on:true,sev:"ok",name:"Pagamento",pat:"pagamento|remunera[çc][ãa]o|valor mensal|fatura|boleto|vencimento",reason:"Verifique valores, datas de vencimento e forma de pagamento.",sugg:"Confirmar vencimentos, forma de pagamento e encargos por atraso."},
    {id:"r12",on:true,sev:"ok",name:"Confidencialidade",pat:"sigilo|confidencial|n[ãa]o divulga",reason:"Cláusula usual; confira prazo de duração e exceções.",sugg:"Confirmar o prazo de sigilo após o término e as exceções legais."},
    {id:"r13",on:true,sev:"ok",name:"Força maior / caso fortuito",pat:"for[çc]a maior|caso fortuito",reason:"Define o que ocorre em eventos imprevisíveis fora do controle das partes.",sugg:"Delimitar os eventos de força maior e seus efeitos sobre as obrigações."},
    {id:"r14",on:true,sev:"medio",name:"Foro de eleição",pat:"foro|comarca|jurisdi[çc][ãa]o",reason:"Define onde eventuais disputas serão resolvidas. Um foro em outra cidade encarece e dificulta a defesa.",sugg:"Verificar se o foro eleito é conveniente para o cliente."},
    {id:"r15",on:true,sev:"ok",name:"Objeto do contrato",pat:"objeto do (contrato|presente)|objeto desta|tem por objeto|presente instrumento",reason:"Define o que está sendo contratado.",sugg:"Confirmar se o objeto está descrito de forma clara e completa."},
    {id:"r16",on:true,sev:"ok",name:"Obrigações das partes",pat:"obriga[çc][õo]es|obriga-se|compromete-se|dever[áa]|incumb",reason:"Descreve os deveres de cada parte.",sugg:"Verificar se as obrigações estão equilibradas entre as partes."},
    {id:"r17",on:true,sev:"medio",name:"Garantia",pat:"garantia|garant[ie]",reason:"Verifique o prazo, a cobertura e as condições da garantia.",sugg:"Confirmar o prazo e o escopo da garantia oferecida."},
    {id:"r18",on:true,sev:"ok",name:"Identificação das partes",pat:"doravante|denominad[oa]s?|qualificad[oa]s?|neste ato representad|t[êe]m entre si",reason:"Confira a correta qualificação das partes (nome, CNPJ/CPF, endereço).",sugg:"Conferir a qualificação completa de cada parte no preâmbulo."},
    {id:"r19",on:true,sev:"ok",name:"Qualificação das partes",pat:"\\bcpf\\b|\\bcnpj\\b|residente|domiciliad|inscrit[oa]|nacionalidade|estado civil|rg n|portador",reason:"Identificação e qualificação das partes (nome, CPF/CNPJ, endereço, estado civil).",sugg:"Conferir se a qualificação de cada parte está completa e correta."},
    {id:"r20",on:true,sev:"ok",name:"Dados de contato",pat:"endere[çc]o eletr[ôo]nico|e-mail|email|telefone",reason:"Dados de contato das partes, usados para notificações e intimações.",sugg:"Confirmar se os dados de contato estão atualizados e corretos."},
    {id:"r21",on:true,sev:"medio",name:"Ação / pedido (peça processual)",pat:"a[çc][ãa]o revisional|peti[çc][ãa]o inicial|requer|pedido de|tutela|liminar|danos morais|juros abusiv|revis[ãa]o (do|de)",reason:"Indica que o documento é uma peça processual, não um contrato; os pedidos merecem conferência.",sugg:"Revisar os pedidos e fundamentos da peça — o Clausa é otimizado para contratos, então confira manualmente."}
  ];
  var EX="CLÁUSULA 1. O prazo de vigência é de 24 meses, renovado automaticamente por iguais períodos, salvo aviso prévio de 60 dias.\nCLÁUSULA 2. O valor mensal é de R$ 12.500,00, reajustado anualmente pelo IPCA.\nCLÁUSULA 3. A CONTRATADA prestará os serviços com exclusividade à CONTRATANTE durante a vigência.\nCLÁUSULA 4. A rescisão antecipada sujeita a parte que lhe der causa ao pagamento de multa de 50% do valor remanescente.\nCLÁUSULA 5. A responsabilidade da CONTRATADA fica limitada ao valor pago nos últimos 12 meses.\nCLÁUSULA 6. As partes mantêm sigilo sobre as informações trocadas.\nCLÁUSULA 7. Fica eleito o foro da comarca de São Paulo/SP.";

  function clone(o){return JSON.parse(JSON.stringify(o))}
  function load(k){try{var v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}}
  function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
  function esc(s){return (s+"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;")}
  // separa em frases sem cortar números como "R$ 12.500,00" (só corta em ponto/ponto e vírgula seguido de espaço)
  function splitSents(t){return t.replace(/([.;])\s+/g,"$1\n").split(/\n+/)}
  function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e}

  // nome automático: "Contrato de locação · 24/11" a partir do texto; senão, a 1ª linha limpa
  function pl(n,um,varios){return n+" "+(n===1?um:varios)}
  function tituloDe(v){
    var TIPOS=[[/loca[çc][ãa]o|locador|locat[áa]rio|aluguel/i,"Contrato de locação"],[/presta[çc][ãa]o de servi[çc]os|contratad[ao]/i,"Prestação de serviços"],
      [/compra e venda|comprador|vendedor/i,"Compra e venda"],[/contrato de trabalho|empregad[oa]r?|CLT/,"Contrato de trabalho"],
      [/confidencialidade|NDA\b/i,"Acordo de confidencialidade"],[/empr[ée]stimo|mutu[áa]rio|financiamento/i,"Empréstimo"],
      [/sociedade|s[óo]cios|quotas/i,"Contrato social"],[/licen[çc]a de (uso|software)/i,"Licença de uso"]];
    var dt=new Date().toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"});
    for(var i=0;i<TIPOS.length;i++)if(TIPOS[i][0].test(v))return TIPOS[i][1]+" · "+dt;
    var first=(v.split("\n")[0]||"").replace(/^\s*cl[áa]usula\s+\S+\s*[.:–-]?\s*/i,"").trim();
    return first?(first.length>42?first.slice(0,42)+"…":first):("Contrato · "+dt);
  }
  var RULES_VERSION=8;
  var rules;
  var savedV=load("clausa-rules-v"), savedRules=load("clausa-rules");
  if(savedV===RULES_VERSION){rules=savedRules||clone(DEFAULTS)}
  else if(savedV>=5&&Array.isArray(savedRules)&&savedRules.length){
    // atualização sem apagar regras personalizadas: acrescenta as regras novas
    // e atualiza o foro só se a pessoa nunca tiver mexido nele
    rules=savedRules;
    var r14=rules.filter(function(r){return r.id==="r14"})[0];
    if(r14&&r14.sev==="ok"&&r14.reason==="Define onde eventuais disputas serão resolvidas."){
      var d14=DEFAULTS.filter(function(d){return d.id==="r14"})[0];r14.sev=d14.sev;r14.reason=d14.reason}
    var r18=rules.filter(function(r){return r.id==="r18"})[0];
    if(r18&&r18.pat==="contratante|contratad[ao]|as partes|locador|locat[áa]rio|outorgante")r18.pat=DEFAULTS.filter(function(d){return d.id==="r18"})[0].pat;
    DEFAULTS.forEach(function(d){if(!rules.some(function(r){return r.id===d.id}))rules.push(clone(d))});
    save("clausa-rules",rules);save("clausa-rules-v",RULES_VERSION)}
  else{rules=clone(DEFAULTS);save("clausa-rules",rules);save("clausa-rules-v",RULES_VERSION)}
  if(!Array.isArray(rules)||!rules.length){rules=clone(DEFAULTS);save("clausa-rules",rules)}
  var templates=load("clausa-templates")||{};
  var convos=load("clausa-convos")||[];
  var current=null;

  // ---------- Conta / nuvem (Supabase) ----------
  function uid(){try{return crypto.randomUUID()}catch(e){return "c"+Date.now()+Math.random().toString(16).slice(2)}}
  function firstName(u){
    var n=(u&&u.user_metadata&&u.user_metadata.nome)||"";
    n=(n+"").trim().split(/\s+/)[0]||"";
    if(!n&&u&&u.email)n=u.email.split("@")[0];
    return n?(n.charAt(0).toUpperCase()+n.slice(1)):"";
  }
  var cfg=window.CLAUSA_CONFIG||{};
  var sbReady=cfg.SUPABASE_URL && cfg.SUPABASE_URL.indexOf("COLE_")<0 && window.supabase;
  var sb=sbReady ? window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY) : null;
  var user=null, syncTimer=null;

  function toRow(c){return {id:c.id,user_id:user.id,titulo:c.title||"Contrato",texto:c.text||"",decisions:c.decisions||{},pinned:!!c.pinned,label:c.label||null,atualizado_em:new Date().toISOString()}}
  function toRowBasic(c){return {id:c.id,user_id:user.id,titulo:c.title||"Contrato",texto:c.text||"",decisions:c.decisions||{},atualizado_em:new Date().toISOString()}}
  function fromRow(r){return {id:r.id,title:r.titulo||"Contrato",text:r.texto||"",decisions:r.decisions||{},pinned:!!r.pinned,label:r.label||null,created:r.criado_em?Date.parse(r.criado_em):Date.now(),synced:true}}
  function markSynced(){convos.forEach(function(c){c.synced=true});save("clausa-convos",convos)}

  function cloudSync(){
    if(!user||!sb||!convos.length)return;
    clearTimeout(syncTimer);
    syncTimer=setTimeout(function(){
      sb.from("contracts").upsert(convos.map(toRow)).then(function(r){
        if(r.error){ // colunas novas talvez ainda não existam — salva o básico
          sb.from("contracts").upsert(convos.map(toRowBasic)).then(function(r2){if(r2.error)console.log("Sync (salvar) erro:",r2.error);else markSynced()});
        }else markSynced();
      });
    },500);
  }
  function cloudDelete(id){
    if(!user||!sb)return;
    sb.from("contracts").delete().eq("id",id).then(function(r){if(r.error)console.log("Sync (excluir) erro:",r.error)});
  }
  function loadCloud(){
    if(!user||!sb)return;
    sb.from("contracts").select("*").order("atualizado_em",{ascending:false}).then(function(r){
      if(r.error){console.log("Sync (carregar) erro:",r.error);return}
      if(Array.isArray(r.data)){
        // não descarta o que foi feito como visitante: contratos locais que nunca subiram
        // para a nuvem são mantidos e enviados para a conta
        var cloud=r.data.map(fromRow),ids={};
        cloud.forEach(function(c){ids[c.id]=1});
        var soLocal=convos.filter(function(c){return !c.synced&&!ids[c.id]&&c.text});
        convos=soLocal.concat(cloud);
        save("clausa-convos",convos);
        current=convos.length?convos[0].id:null;
        renderSidebar();renderMain();
        if(soLocal.length)cloudSync();
      }
    });
  }
  function renderAccount(){
    var a=byId("account");if(!a)return;
    if(user){
      var nm=firstName(user);
      a.innerHTML='<div class="acct-info">'+(nm?'<span class="acct-nm">'+esc(nm)+'</span>':'')+'<span class="acct-em" title="'+esc(user.email)+'">'+esc(user.email)+'</span></div><button class="acct-out" id="sair" type="button">Sair</button>';
      var s=byId("sair");if(s)s.onclick=function(){
        // ao sair, apaga a cópia local dos contratos: num computador compartilhado,
        // a próxima pessoa não pode ver os contratos da conta (eles continuam salvos na nuvem)
        try{localStorage.removeItem("clausa-convos")}catch(e){}
        convos=[];
        sb.auth.signOut().then(function(){location.href="entrar.html"});
      };
    }else{
      a.innerHTML='<a class="acct-login" href="entrar.html">'+'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.5 19a4.5 4.5 0 0 0 .5-8.97A6 6 0 0 0 6.34 9.5 4.75 4.75 0 0 0 6.5 19z"/></svg>'+'Entrar para salvar na nuvem</a>';
    }
  }

  function persistConvos(){save("clausa-convos",convos);cloudSync()}
  function persistRules(){save("clausa-rules",rules)}
  function getConvo(id){for(var i=0;i<convos.length;i++)if(convos[i].id===id)return convos[i];return null}

  // ---------- Análise ----------
  function computeFindings(text){
    var sents=splitSents(text),found=[];
    rules.forEach(function(r){
      if(!r.on||!r.pat)return;
      var re;try{re=new RegExp(r.pat,"i")}catch(e){return}
      if(!re.test(text))return;
      var hit="";
      for(var i=0;i<sents.length;i++){var s=sents[i].trim();if(s.length>=8&&re.test(s)){hit=s;break}}
      if(!hit){var idx=text.search(re);hit=text.slice(Math.max(0,idx-30),idx+140).replace(/\s+/g," ").trim()}
      // id da regra identifica o apontamento: aprovações não "pulam" de cláusula quando a lista de regras muda
      found.push({id:r.id||r.name,sev:r.sev,name:r.name,reason:r.reason,sugg:r.sugg,s:hit});
    });
    found.sort(function(a,b){var o={alto:0,medio:1,ok:2};return o[a.sev]-o[b.sev]});
    return found;
  }

      d.innerHTML=DOC+dot+'<span class="ct">'+esc(c.title||"Sem título")+'</span>'+pin+'<button class="cmenu" title="Opções">⋯</button>';

  // ---------- Menu do contrato (renomear / fixar / etiqueta / excluir) ----------

  var ICON={

  };
  var modalResolve=null,modalPrev=null;
  // abre a janela e devolve uma Promise: true (confirmou), texto (se tiver campo) ou null (cancelou)
  function dialog(o){
    return new Promise(function(res){
      if(modalResolve)modalResolve(null);
      var m=byId("modal"),inp=byId("minp"),ok=byId("mok"),cc=byId("mcancel"),hasInput=o.input!==undefined;
      modalPrev=document.activeElement;
      byId("mcard").className="mcard"+(o.danger?" danger":"");
      byId("mico").innerHTML=o.icon||ICON.alert;
      byId("mttl").textContent=o.title||"";
      var p=byId("mtxt");if(o.html)p.innerHTML=o.html;else p.textContent=o.text||"";p.hidden=!(o.text||o.html);
      inp.hidden=!hasInput;inp.value=hasInput?o.input:"";
      ok.textContent=o.ok||"OK";ok.className="btn sm"+(o.danger?" danger":"");
      cc.hidden=!!o.noCancel;cc.textContent=o.cancel||"Cancelar";
      modalResolve=function(v){
        modalResolve=null;m.classList.remove("open");m.setAttribute("aria-hidden","true");
        try{if(modalPrev&&modalPrev.focus&&modalPrev.isConnected)modalPrev.focus()}catch(e){}
        res(v);
      };
      m.classList.add("open");m.setAttribute("aria-hidden","false");
      setTimeout(function(){if(hasInput){inp.focus();inp.select()}else ok.focus()},40);
    });
  }
  function closeModal(v){if(modalResolve)modalResolve(v)}
  byId("mok").onclick=function(){closeModal(byId("minp").hidden?true:byId("minp").value)};
  byId("mcancel").onclick=function(){closeModal(null)};
  byId("modal").addEventListener("mousedown",function(e){if(e.target===byId("modal"))closeModal(null)});  // clicar fora cancela
  byId("minp").addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();byId("mok").click()}});
  // mantém o Tab dentro da janela enquanto ela está aberta
  byId("modal").addEventListener("keydown",function(e){
    if(e.key!=="Tab")return;
    var f=[].filter.call(byId("mcard").querySelectorAll("button,input"),function(x){return !x.hidden});
    if(!f.length)return;var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}
    else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}
  });

  // ---------- Menu do contrato ----------
  function closeMenu(){
    var m=document.querySelector(".cmenupop:not(.closing)");
    var on=document.querySelector(".cmenu.on");if(on)on.classList.remove("on");
    if(!m)return;
    m.classList.add("closing");  // anima a saída antes de remover
    var done=function(){if(m.parentNode)m.remove()};
    m.addEventListener("animationend",function(e){if(e.target===m)done()});
    setTimeout(done,220);        // garantia, caso a animação não dispare
  }
  function renameConvo(c){
    dialog({title:"Renomear contrato",text:"Dê um nome que ajude a encontrar este contrato depois.",input:c.title||"",ok:"Salvar",icon:ICON.edit}).then(function(nv){
      if(nv===null)return;nv=nv.trim();if(!nv)return;
      c.title=nv;persistConvos();renderSidebar();
      if(c.id===current)byId("mtitle").textContent=c.text?c.title:"Clausa";
    });
  }
  function openMenu(c,btn){
    closeMenu();
    btn.classList.add("on");
    var m=el("div","cmenupop");m.dataset.cid=c.id;
    var html='<button data-a="rename">✏️ Renomear</button>'+
      '<button data-a="pin">📌 '+(c.pinned?"Desafixar":"Fixar no topo")+'</button>'+
      '<div class="sep"></div><div class="lbl">Etiqueta</div>';
    for(var k in LABELS){html+='<button data-a="lbl" data-k="'+k+'"><span class="dot" style="background:'+LABELS[k].c+'"></span>'+LABELS[k].t+(c.label===k?" ✓":"")+'</button>'}
    html+='<button data-a="lbl" data-k=""><span class="dot" style="background:var(--line)"></span>Sem etiqueta'+(!c.label?" ✓":"")+'</button>';
    html+='<div class="sep"></div><button class="del" data-a="del">🗑️ Excluir</button>';
    m.innerHTML=html;
    [].forEach.call(m.children,function(ch,i){ch.style.setProperty("--i",i)});  // itens entram em cascata
    document.body.appendChild(m);
    var r=btn.getBoundingClientRect(),mw=210;
    var left=Math.max(8,Math.min(r.left,window.innerWidth-mw-8));
    m.style.left=left+"px";
    m.style.top=(r.bottom+4)+"px";
    var mh=m.getBoundingClientRect().height,up=r.bottom+4+mh>window.innerHeight;
    if(up)m.style.top=Math.max(8,r.top-mh-4)+"px";
    // o menu "cresce" a partir do botão ⋯ (para baixo ou para cima, conforme o espaço)
    m.style.transformOrigin=(r.left+r.width/2-left)+"px "+(up?"100%":"0");
    m.onclick=function(e){
      var b=e.target.closest("button");if(!b)return;
      var a=b.dataset.a;
      if(a==="rename")renameConvo(c);
      else if(a==="pin"){c.pinned=!c.pinned;persistConvos();renderSidebar()}
      else if(a==="lbl"){c.label=b.dataset.k||null;persistConvos();renderSidebar()}
      else if(a==="del")delConvo(c.id);
      closeMenu();
    };
  }
  document.addEventListener("click",function(e){var m=document.querySelector(".cmenupop:not(.closing)");if(m&&!m.contains(e.target)&&!e.target.closest(".cmenu"))closeMenu()});
  // o menu ⋯ fica preso na tela (position:fixed): se a lista rolar ou a janela mudar, ele ficaria solto
  byId("convos").addEventListener("scroll",closeMenu,{passive:true});
  window.addEventListener("resize",closeMenu);
  // Esc fecha o que estiver aberto, do mais recente para o mais antigo
  document.addEventListener("keydown",function(e){
    if(e.key!=="Escape")return;
    if(modalResolve){closeModal(null);return}
    if(document.querySelector(".cmenupop:not(.closing)")){closeMenu();return}
    if(byId("drawer").classList.contains("open")){closeDrawer();return}
    closeNav();
  });

  function newConvo(){
    // reaproveita um contrato vazio em vez de acumular vários "Novo contrato" sem texto
    var empty=convos.filter(function(x){return !x.text})[0];
    if(empty){current=empty.id}
    else{
      var c={id:uid(),title:"Novo contrato",text:"",decisions:{},pinned:false,label:null,created:Date.now()};
      convos.unshift(c);current=c.id;persistConvos();
    }
    renderSidebar();renderMain();closeNav();
    byId("input").focus();
  }
  function openConvo(id){current=id;renderSidebar();renderMain();closeNav()}
  function delConvo(id){
    var c=getConvo(id);
    dialog({title:"Excluir contrato?",danger:true,icon:ICON.trash,ok:"Excluir",
      html:"<b>"+esc((c&&c.title)||"Este contrato")+"</b> será apagado"+(user?" deste aparelho e da sua conta":"")+", junto com as aprovações. Essa ação não pode ser desfeita."
    }).then(function(ok){
      if(!ok)return;
      convos=convos.filter(function(x){return x.id!==id});
      if(current===id)current=convos.length?convos[0].id:null;
      cloudDelete(id);persistConvos();renderSidebar();renderMain();
    });
  }

  // ---------- Main ----------
  var renderSeq=0, typeTimer=null;
  function renderMain(animate){
    var seq=++renderSeq;            // cada desenho da tela tem um número; tarefas atrasadas de um desenho antigo são descartadas
    clearInterval(typeTimer);       // para o "digitando" da conversa anterior
    var inner=byId("inner"),c=current?getConvo(current):null;
    byId("mtitle").textContent=c&&c.text?c.title:"Clausa";
    inner.innerHTML="";
    if(!c||!c.text){
      var gg=greetings();var g=gg[Math.floor(Math.random()*gg.length)];
      var w=el("div","greet");
      w.innerHTML=SCALES.replace('class="scales"','class="scales" style="width:46px;height:46px"')+
        '<h1>'+esc(g)+'</h1>'+
        '<p>Cole o texto de um contrato na caixa abaixo e a Clausa aponta os pontos de atenção, com sugestões para você aprovar.</p>'+
        '<div class="chips"><button class="btn ghost sm" id="ex">Carregar exemplo</button><label class="btn ghost sm" for="file">Carregar arquivo .txt</label></div>';
      inner.appendChild(w);
      var ex=byId("ex");if(ex)ex.onclick=function(){byId("input").value=EX;sizeInput();send()};
      byId("input").placeholder="Cole o contrato aqui…";
      return;
    }
    byId("input").placeholder="Cole uma nova versão para reanalisar…";
    var mu=el("div","msg you");
    mu.innerHTML='<div class="ava you">'+QUILL+'</div><div class="mbody"><div class="mname">Você</div>'+
      '<div class="contract-txt" id="ctxt">'+esc(c.text)+'</div>'+(c.text.length>400?'<button class="cexpand" id="cexp">ver contrato completo ▾</button>':'')+'</div>';
    inner.appendChild(mu);
    var cexp=byId("cexp");if(cexp)cexp.onclick=function(){var t=byId("ctxt");t.classList.toggle("open");cexp.textContent=t.classList.contains("open")?"recolher ▴":"ver contrato completo ▾"};
    if(animate){
      var tb=el("div","msg");tb.id="thinking";
      tb.innerHTML='<div class="ava ai">'+aiScales()+'</div><div class="mbody"><div class="mname">Clausa</div><div class="thinking"><span>Analisando o contrato</span><span class="dots"><i></i><i></i><i></i></span></div></div>';
      inner.appendChild(tb);byId("scroll").scrollTop=byId("scroll").scrollHeight;
      setTimeout(function(){
        if(seq!==renderSeq)return;  // o usuário trocou de conversa durante a análise
        var th=byId("thinking");if(th)th.remove();appendAssistant(inner,c,true);byId("scroll").scrollTop=byId("scroll").scrollHeight
      },Math.min(1500,600+c.text.length*0.3));
    }else{appendAssistant(inner,c,false);byId("scroll").scrollTop=byId("scroll").scrollHeight}
  }
  function aiScales(){return SCALES.replace('class="scales"','class="scales" style="width:18px;height:18px"')}
  function appendAssistant(inner,c,typeIt){
    var found=computeFindings(c.text);
    var ma=el("div","msg");
    var head='<div class="ava ai">'+aiScales()+'</div>';
    if(!found.length){
      var ativas=rules.filter(function(r){return r.on}).length;
      var msg=(ativas===0)
        ? "As regras de revisão não estão carregadas. Abra “Regras & modelos” e clique em “Restaurar regras padrão”, depois envie o contrato novamente."
        : "Revisei o documento e não encontrei pontos de atenção com as regras atuais. Pode ser que esteja tudo tranquilo — ou que o texto use termos diferentes dos que as regras procuram. Você pode ajustar as regras em “Regras & modelos”.";
      ma.innerHTML=head+'<div class="mbody"><div class="mname">Clausa</div><p class="mut" id="typ"></p></div>';
      inner.appendChild(ma);
      typeWords(byId("typ"),msg,typeIt,null);
      return;
    }
    var cnt={alto:0,medio:0,ok:0};found.forEach(function(f){cnt[f.sev]++});
    var rest='<div class="aireveal" id="rest"><div class="sumbar"><div class="stat alto"><b>'+cnt.alto+'</b><span>Risco alto</span></div><div class="stat medio"><b>'+cnt.medio+'</b><span>Atenção</span></div><div class="stat ok"><b>'+cnt.ok+'</b><span>Sem alerta</span></div><div class="stat apr"><b id="aprn">0</b><span>Aprovadas</span></div></div>';
    found.forEach(function(f,i){
      var dec=c.decisions[f.id];
      var block='<div class="find '+f.sev+(dec==="rej"?" rej":"")+'" id="find'+i+'"><div class="fh"><span class="sev '+f.sev+'">'+LB[f.sev]+'</span><span class="ft">'+esc(f.name)+'</span></div>'+
        '<q>'+esc(f.s.length>260?f.s.slice(0,260)+"…":f.s)+'</q><div class="why">'+esc(f.reason)+'</div>';
      if(f.sugg){
        if(f.sev==="ok"){
          block+='<div class="sugg note-ok"><span class="sl">Observação</span><p>'+esc(f.sugg)+'</p></div>';
        }else{
          block+='<div class="sugg"><span class="sl">Sugestão de melhoria</span><p>'+esc(f.sugg)+'</p><div class="sa"><button class="btn sm" data-apr="'+i+'">Aprovar</button><button class="btn ghost sm" data-rej="'+i+'">Rejeitar</button><span class="state '+(dec||"")+'" data-st="'+i+'" '+(dec?"":"hidden")+'>'+(dec==="apr"?"✓ Aprovada":dec==="rej"?"✕ Rejeitada":"")+'</span></div></div>';
        }
      }
      block+='</div>';
      rest+=block;
    });
    rest+='<div class="reprow" style="margin-top:4px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn ghost sm" id="rep">Copiar relatório</button><button class="btn ghost sm" id="dl">Baixar relatório (.txt)</button></div></div>';
    ma.innerHTML=head+'<div class="mbody"><div class="mname">Clausa</div><p id="typ" style="margin:0 0 12px"></p>'+rest+'</div>';
    inner.appendChild(ma);
    $("[data-apr]",inner).forEach(function(b){b.onclick=function(){decide(found,+b.dataset.apr,"apr")}});
    $("[data-rej]",inner).forEach(function(b){b.onclick=function(){decide(found,+b.dataset.rej,"rej")}});
    byId("rep").onclick=function(){copyReport(c,found)};
    var dlb=byId("dl");if(dlb)dlb.onclick=function(){downloadReport(c,found)};
    updateApr(c,found);
    typeWords(byId("typ"),"Revisei o contrato e encontrei "+found.length+(found.length===1?" ponto":" pontos")+" para a sua atenção:",typeIt,function(){var r=byId("rest");if(r)r.classList.add("show");byId("scroll").scrollTop=byId("scroll").scrollHeight});
  }
  function typeWords(elm,text,typeIt,done){
    if(!elm){if(done)done();return}
    if(!typeIt||!matchMedia("(prefers-reduced-motion: no-preference)").matches){elm.textContent=text;if(done)done();return}
    var words=text.split(" "),i=0;elm.textContent="";
    clearInterval(typeTimer);
    typeTimer=setInterval(function(){
      if(!elm.isConnected){clearInterval(typeTimer);return}
      elm.textContent+=(i?" ":"")+words[i];i++;byId("scroll").scrollTop=byId("scroll").scrollHeight;
      if(i>=words.length){clearInterval(typeTimer);if(done)done()}
    },42);
  }
  function decide(found,i,v){
    var c=getConvo(current);if(!c||!found[i])return;
    c.decisions[found[i].id]=v;persistConvos();
    var st=document.querySelector('[data-st="'+i+'"]');st.hidden=false;st.className="state "+v;st.textContent=v==="apr"?"✓ Aprovada":"✕ Rejeitada";
    byId("find"+i).classList.toggle("rej",v==="rej");
    updateApr(c,found);
  }
  // conta só as aprovações dos apontamentos que estão na tela
  function updateApr(c,found){var n=0;found.forEach(function(f){if(c.decisions[f.id]==="apr")n++});var e=byId("aprn");if(e)e.textContent=n}

  function buildReport(c,found){
    var cnt={alto:0,medio:0,ok:0},apr=0;found.forEach(function(f){cnt[f.sev]++;if(c.decisions[f.id]==="apr")apr++});
    var lines=["RELATÓRIO DE REVISÃO — CLAUSA","Contrato: "+(c.title||""),"Gerado em "+new Date().toLocaleString("pt-BR"),"",
      "RESUMO: "+pl(cnt.alto,"risco alto","riscos altos")+" · "+pl(cnt.medio,"ponto de atenção","pontos de atenção")+" · "+cnt.ok+" sem alerta · "+pl(apr,"sugestão aprovada","sugestões aprovadas"),
      "----------------------------------------",""];
    found.forEach(function(f){var d=c.decisions[f.id];
      lines.push("["+LB[f.sev].toUpperCase()+"] "+f.name);
      lines.push("Trecho: "+f.s.trim());lines.push("Motivo: "+f.reason);
      if(f.sugg)lines.push("Sugestão: "+f.sugg+"  ->  "+(d==="apr"?"APROVADA":d==="rej"?"REJEITADA":"pendente"));
      lines.push("");
    });
    lines.push("— A Clausa aponta os riscos; a decisão é sempre do advogado.");
    return lines.join("\n");
  }
  function copyReport(c,found){
    var txt=buildReport(c,found);
    var falhou=function(){dialog({title:"Não deu pra copiar",text:"O navegador bloqueou a cópia automática. Use “Baixar relatório (.txt)” para guardar o relatório.",ok:"Entendi",noCancel:true})};
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(function(){toast("Relatório copiado!")},falhou);
    else falhou();
  }
  function downloadReport(c,found){
    var txt=buildReport(c,found);
    var blob=new Blob([txt],{type:"text/plain;charset=utf-8"});
    var nm=(c.title||"revisao").replace(/[^\wÀ-ſ -]/g,"").trim().slice(0,40)||"revisao";
    var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="Clausa - "+nm+".txt";
    document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},120);
  }
  function toast(m){var t=byId("rep");if(!t)return;var o=t.textContent;t.textContent=m;setTimeout(function(){t.textContent=o},2000)}

  // ---------- Enviar ----------
  function send(){
    var v=byId("input").value.trim();if(v.length<10)return;
    var c=current?getConvo(current):null;
    if(!c){c={id:uid(),title:"",text:"",decisions:{},pinned:false,label:null,created:Date.now()};convos.unshift(c);current=c.id}
    c.text=v;c.decisions={};
    c.title=tituloDe(v);
    byId("input").value="";sizeInput();persistConvos();renderSidebar();renderMain(true);
  }
  function sizeInput(){var t=byId("input");t.style.height="auto";t.style.height=Math.min(t.scrollHeight,180)+"px"}

  // ---------- Regras (drawer) ----------
  function renderRules(){
    var box=byId("rules");box.innerHTML="";
    rules.forEach(function(r,i){
      var d=el("div","rule"+(r.on?"":" off"));
      d.innerHTML='<div class="rh"><label class="sw"><input type="checkbox" '+(r.on?"checked":"")+' data-t="'+i+'"><i></i></label><span class="nm">'+esc(r.name)+'</span><span class="sev '+r.sev+'">'+LB[r.sev]+'</span></div>'+
        '<div class="rdet"><div><b>Motivo:</b> '+esc(r.reason)+'</div><div><b>Sugestão:</b> '+esc(r.sugg)+'</div><div style="margin-top:8px;display:flex;gap:8px"><button class="btn ghost tiny" data-edit="'+i+'">Editar</button><button class="btn ghost tiny" data-del="'+i+'">Excluir</button></div></div>'+
        '<button class="rtoggle" data-o="'+i+'">detalhes ▾</button>';
      box.appendChild(d);
    });
    $("input[data-t]",box).forEach(function(c){c.onchange=function(){rules[+c.dataset.t].on=c.checked;persistRules();renderRules();if(current)renderMain()}});
    $("[data-o]",box).forEach(function(b){b.onclick=function(){b.parentNode.classList.toggle("open")}});
    $("[data-edit]",box).forEach(function(b){b.onclick=function(){editRule(+b.dataset.edit)}});
    $("[data-del]",box).forEach(function(b){b.onclick=function(){
      var i=+b.dataset.del,r=rules[i];
      dialog({title:"Excluir regra?",danger:true,icon:ICON.trash,ok:"Excluir",
        html:"A regra <b>"+esc(r.name)+"</b> deixa de ser procurada nos contratos. Se quiser só pausar, use o botão de ligar/desligar."
      }).then(function(ok){if(!ok)return;rules.splice(rules.indexOf(r),1);persistRules();renderRules();if(current)renderMain()});
    }});
  }
  function sel(a,b){return a===b?" selected":""}
  function editRule(i){
    var isNew=(i<0),r=isNew?{id:"r"+Date.now(),on:true,sev:"medio",name:"",pat:"",reason:"",sugg:""}:rules[i];
    var box=byId("rules");
    var aberto=byId("f-name");if(aberto)aberto.closest(".rule").remove();  // só um formulário de edição por vez
    var f=el("div","rule open");
    f.innerHTML='<div class="field"><label>Nome</label><input id="f-name" value="'+esc(r.name)+'"></div>'+
      '<div class="field"><label>Nível</label><select id="f-sev"><option value="alto"'+sel(r.sev,"alto")+'>Risco alto</option><option value="medio"'+sel(r.sev,"medio")+'>Atenção</option><option value="ok"'+sel(r.sev,"ok")+'>Sem alerta</option></select></div>'+
      '<div class="field"><label>Palavras-chave (separe por | )</label><input id="f-pat" value="'+esc(r.pat)+'"></div>'+
      '<div class="field"><label>Motivo</label><textarea id="f-reason">'+esc(r.reason)+'</textarea></div>'+
      '<div class="field"><label>Sugestão de melhoria</label><textarea id="f-sugg">'+esc(r.sugg)+'</textarea></div>'+
      '<div style="display:flex;gap:8px"><button class="btn sm" id="f-save">Salvar</button><button class="btn ghost sm" id="f-cancel">Cancelar</button></div>';
    box.insertBefore(f,box.firstChild);
    byId("f-save").onclick=function(){
      var pat=byId("f-pat").value.trim();
      // padrão inválido (ex.: parêntese sem fechar) faria a regra ser ignorada sem aviso
      try{new RegExp(pat,"i")}catch(e){
        dialog({title:"Palavra-chave com erro",text:"Tem um caractere que a busca não entende, como um parêntese ou colchete sem fechar. Corrija e salve de novo.",ok:"Corrigir",noCancel:true})
          .then(function(){var fp=byId("f-pat");if(fp)fp.focus()});
        return}
      r.name=byId("f-name").value.trim()||"Regra";r.sev=byId("f-sev").value;r.pat=pat;r.reason=byId("f-reason").value.trim();r.sugg=byId("f-sugg").value.trim();if(isNew)rules.push(r);persistRules();renderRules();if(current)renderMain()};
    byId("f-cancel").onclick=renderRules;
  }
  function renderTpls(){var s=byId("tpls");s.innerHTML='<option value="">— modelos salvos —</option>';Object.keys(templates).forEach(function(n){var o=el("option",null,n);o.value=n;s.appendChild(o)})}

  // ---------- Eventos ----------
  byId("new").onclick=newConvo;
  byId("send").onclick=send;
  byId("input").addEventListener("input",sizeInput);
  byId("input").addEventListener("keydown",function(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}});
  document.addEventListener("change",function(e){
    if(!e.target||e.target.id!=="file")return;
    var inp=e.target,f=inp.files[0];if(!f)return;
    var rd=new FileReader();
    rd.onload=function(){
      // .txt salvo no Bloco de Notas antigo vem em Windows-1252: em UTF-8 os acentos viram "�"
      if(rd.result.indexOf("�")>=0&&!rd.retried){rd.retried=true;rd.readAsText(f,"windows-1252");return}
      byId("input").value=rd.result;sizeInput();send();
      inp.value="";  // permite carregar o mesmo arquivo de novo
    };
    rd.readAsText(f);
  });
  byId("menu").onclick=function(){byId("app").classList.toggle("nav-open")};
  function closeNav(){byId("app").classList.remove("nav-open")}
  byId("navshade").onclick=closeNav;  // tocar fora do menu lateral fecha
  byId("navclose").onclick=closeNav;  // ✕ dentro do menu (o painel cobre o ☰ no celular)
  byId("openrules").onclick=function(){closeNav();byId("drawer").classList.add("open");byId("overlay").classList.add("open");renderRules();renderTpls()};
  function closeDrawer(){byId("drawer").classList.remove("open");byId("overlay").classList.remove("open")}
  byId("closedrawer").onclick=closeDrawer;byId("overlay").onclick=closeDrawer;
  byId("savetpl").onclick=function(){var n=byId("tplname").value.trim();if(!n)return;templates[n]=clone(rules);save("clausa-templates",templates);byId("tplname").value="";renderTpls()};
  byId("loadtpl").onclick=function(){var n=byId("tpls").value;if(!n||!templates[n])return;rules=clone(templates[n]);persistRules();renderRules();if(current)renderMain()};
  byId("deltpl").onclick=function(){
    var n=byId("tpls").value;if(!n)return;
    dialog({title:"Excluir modelo?",danger:true,icon:ICON.trash,ok:"Excluir",html:"O modelo <b>"+esc(n)+"</b> será apagado. As regras que estão em uso agora não mudam."})
      .then(function(ok){if(!ok)return;delete templates[n];save("clausa-templates",templates);renderTpls()});
  };
  byId("resetrules").onclick=function(){
    dialog({title:"Restaurar regras padrão?",danger:true,icon:ICON.reset,ok:"Restaurar",
      text:"Todas as regras voltam ao original: as que você criou ou editou serão perdidas. Para guardá-las, salve antes como modelo."})
      .then(function(ok){if(!ok)return;rules=clone(DEFAULTS);persistRules();renderRules();if(current)renderMain()});
  };

  // adiciona input de arquivo oculto (reaproveitado pelos botões "Carregar .txt")
  var fi=el("input");fi.type="file";fi.id="file";fi.accept=".txt,text/plain";fi.style.display="none";document.body.appendChild(fi);

  // start
  if(convos.length){current=convos[0].id}
  renderSidebar();renderMain();sizeInput();

  // conta / nuvem: se estiver logado, carrega os contratos da nuvem
  if(sb){
    sb.auth.getSession().then(function(r){
      user=(r.data&&r.data.session)?r.data.session.user:null;
      if(user)NAME=firstName(user);
      renderAccount();
      renderMain();
      if(user)loadCloud();
    });
  }else{
    renderAccount();
  }
})();
</script>
</body>
</html>
