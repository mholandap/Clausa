<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clausa — App</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.95.0/dist/umd/supabase.js"></script>
<script src="js/clausa-config.js"></script>
<style>
:root{
  --paper:#0B0B0C;--panel:#0E0E0F;--card:#161617;--card2:#1D1D1F;--ink:#FAFAFA;--gray:#9B9B9E;--line:#2A2A2D;
  --orange:#FF8A33;--orange-deep:#E2590B;
  --alto:#F0625A;--medio:#E0B65C;--ok:#5FB58C;
  --glow-a:rgba(255,122,26,.24);--glow-b:rgba(226,89,11,.18);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;position:relative;z-index:0;background:var(--paper);color:var(--ink);font:400 15px/1.55 "Inter",system-ui,sans-serif;overflow:hidden}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(55% 45% at 50% 6%,var(--glow-a),transparent 72%),radial-gradient(48% 42% at 85% 56%,var(--glow-b),transparent 70%),radial-gradient(44% 42% at 13% 88%,var(--glow-a),transparent 72%)}
@keyframes glow-breathe{0%,100%{opacity:.8;transform:translateY(0)}50%{opacity:1;transform:translateY(-16px)}}
@keyframes grad-slide{to{background-position:200% 0}}
.find,.contract-txt{position:relative;overflow:hidden}
.find::before,.contract-txt::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,transparent,var(--orange) 18%,rgba(255,255,255,.85) 50%,var(--orange) 82%,transparent);background-size:200% 100%}
@media (prefers-reduced-motion:no-preference){body::after{animation:glow-breathe 18s ease-in-out infinite}.find::before,.contract-txt::before{animation:grad-slide 5s linear infinite}}
h1,h2,h3{font-family:"Playfair Display",Georgia,serif;font-weight:600;margin:0;line-height:1.15}
.scales{color:var(--orange);flex:none}
.btn{font:600 14px "Inter",sans-serif;border:0;border-radius:10px;padding:10px 16px;background:var(--orange-deep);color:#fff;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:transform .15s,filter .15s}
.btn:hover{transform:translateY(-1px);filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:7px 12px;font-size:13px}
.btn.tiny{padding:5px 10px;font-size:12px;border-radius:8px}
.mut{color:var(--gray)}.small{font-size:13px}

.app{display:flex;height:100%;overflow:hidden}

/* ---- Sidebar ---- */
.side{width:286px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.side-top{padding:16px 16px 10px}
.logo{display:flex;align-items:center;gap:9px;font-family:"Playfair Display",Georgia,serif;font-weight:600;font-size:23px;color:var(--ink);text-decoration:none;margin-bottom:14px}
.logo .scales{width:23px;height:23px}
#new{width:100%}
.convos{flex:1;overflow-y:auto;padding:6px 10px}
.clabel{font:600 11px "Inter";letter-spacing:.08em;text-transform:uppercase;color:var(--gray);padding:12px 8px 6px}
.cfilter{display:flex;flex-wrap:wrap;gap:5px;padding:0 2px 8px}
.cfilter .fchip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:none;color:var(--gray);font:600 11px "Inter";padding:4px 9px;border-radius:20px;cursor:pointer}
.cfilter .fchip:hover{color:var(--ink)}
.cfilter .fchip.on{background:var(--card);color:var(--ink);border-color:var(--orange)}
.cfilter .fchip .fdot{width:7px;height:7px;border-radius:50%}
.convo{display:flex;align-items:center;gap:8px;padding:10px 10px;border-radius:9px;cursor:pointer;color:var(--ink);font-size:14px;margin-bottom:2px}
.convo:hover{background:var(--card)}
.convo.active{background:var(--card);outline:1px solid var(--line)}
.convo .ci{width:15px;height:15px;flex:none;color:var(--orange)}
.convo .ct{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.convo .cx{opacity:0;border:0;background:none;color:var(--gray);cursor:pointer;font-size:16px;line-height:1;padding:2px 4px;border-radius:5px}
.convo:hover .cx{opacity:1}.convo .cx:hover{color:var(--alto);background:var(--paper)}
.convo .cdot{width:8px;height:8px;border-radius:50%;flex:none}
.convo .cpin{width:13px;height:13px;flex:none;color:var(--orange)}
.convo .cmenu{opacity:0;border:0;background:none;color:var(--gray);cursor:pointer;font-size:17px;line-height:1;padding:2px 6px;border-radius:5px;flex:none}
.convo:hover .cmenu,.convo.active .cmenu{opacity:1}
.convo .cmenu:hover{color:var(--ink);background:var(--paper)}
.cmenupop{position:fixed;z-index:200;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 34px rgba(0,0,0,.55);padding:6px;min-width:200px}
.cmenupop button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:0;color:var(--ink);cursor:pointer;padding:8px 10px;border-radius:7px;font:500 13px "Inter"}
.cmenupop button:hover{background:var(--paper)}
.cmenupop .sep{height:1px;background:var(--line);margin:5px 4px}
.cmenupop .lbl{font:600 10.5px "Inter";letter-spacing:.06em;text-transform:uppercase;color:var(--gray);padding:6px 10px 3px}
.cmenupop .dot{width:9px;height:9px;border-radius:50%;flex:none}
.cmenupop .del{color:var(--alto)}
.side-foot{border-top:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:6px}
.side-foot button,.side-foot a{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;color:var(--gray);font:500 13px "Inter";cursor:pointer;text-decoration:none;padding:8px 10px;border-radius:8px}
.side-foot button:hover,.side-foot a:hover{background:var(--card);color:var(--ink)}
.side-acct{display:flex;align-items:center;gap:8px;padding:6px 10px 10px;margin-bottom:4px;border-bottom:1px solid var(--line)}
.side-acct .acct-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.side-acct .acct-nm{font:600 13px "Inter";color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-acct .acct-em{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:400 11px "Inter";color:var(--gray)}
.side-acct .acct-out{flex:none;background:none;border:1px solid var(--line);color:var(--gray);font:600 11.5px "Inter";cursor:pointer;padding:5px 10px;border-radius:7px;width:auto}
.side-acct .acct-out:hover{background:var(--card);color:var(--ink)}
.side-acct .acct-login{display:flex;align-items:center;gap:8px;width:100%;color:var(--orange);font:600 12.5px "Inter";text-decoration:none;padding:4px 0}
.side-acct .acct-login:hover{text-decoration:underline;background:none}

/* ---- Main ---- */
.main{flex:1;display:flex;flex-direction:column;min-width:0;padding-top:env(safe-area-inset-top,0px)}
.main-top{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);min-height:56px}
.menu-btn{display:none;background:none;border:0;color:var(--ink);cursor:pointer;font-size:20px;padding:4px}
.main-top .mt{font-weight:600;font-size:15px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scroll{flex:1;overflow-y:auto;padding:24px 20px}
.inner{max-width:760px;margin:0 auto}

/* saudação */
.greet{min-height:52vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px}
.greet .scales{width:46px;height:46px}
.greet h1{font-size:clamp(28px,4.5vw,40px)}
.greet p{color:var(--gray);max-width:46ch;margin:0}
.chips{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:6px}

/* mensagens */
.msg{display:flex;gap:12px;margin-bottom:22px}
.ava{width:30px;height:30px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px}
.ava.you{background:var(--card2);color:var(--ink);border:1px solid var(--line)}
.ava.you .quill{color:var(--ink);width:17px;height:17px}
.msg.you{flex-direction:row-reverse}
.msg.you .mbody{display:flex;flex-direction:column;align-items:flex-end}
.msg.you .mname{text-align:right}
.msg.you .contract-txt{max-width:88%}
.msg.you .cexpand{align-self:flex-end}
.ava.ai{background:rgba(255,138,51,.14);border:1px solid rgba(255,138,51,.35)}
.ava.ai .scales{width:18px;height:18px}
.mbody{flex:1;min-width:0}
.mname{font-weight:600;font-size:13px;margin-bottom:5px}
.aireveal{opacity:0;transform:translateY(8px);transition:opacity .55s ease,transform .55s cubic-bezier(.2,.7,.2,1)}
.aireveal.show{opacity:1;transform:none}
.thinking{display:flex;align-items:center;gap:9px;color:var(--gray);font-size:14px}
.dots{display:inline-flex;gap:4px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--orange);display:inline-block;animation:bd 1s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bd{0%,60%,100%{transform:translateY(0);opacity:.35}30%{transform:translateY(-5px);opacity:1}}
.contract-txt{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:13.5px;white-space:pre-wrap;max-height:150px;overflow:hidden;position:relative}
.contract-txt.open{max-height:none}
.cexpand{background:none;border:0;color:var(--orange);font:500 12px "Inter";cursor:pointer;padding:6px 0 0}

.sumbar{display:flex;gap:10px;flex-wrap:wrap;margin:4px 0 16px}
.stat{flex:1 1 84px;background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:10px 13px}
.stat b{display:block;font:700 22px "Playfair Display",Georgia,serif}
.stat.alto b{color:var(--alto)}.stat.medio b{color:var(--medio)}.stat.ok b{color:var(--ok)}.stat.apr b{color:var(--orange)}
.stat span{font-size:11.5px;color:var(--gray)}
.find{border:1px solid var(--line);border-left:3px solid var(--line);border-radius:10px;padding:13px;margin-bottom:11px;background:var(--card2)}
.find.alto{border-left-color:var(--alto)}.find.medio{border-left-color:var(--medio)}.find.ok{border-left-color:var(--ok)}
.find .fh{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.sev{font:600 11px "Inter";border-radius:30px;padding:3px 9px;white-space:nowrap;border:1px solid transparent}
.sev.alto{color:var(--alto);border-color:rgba(240,98,90,.4);background:rgba(240,98,90,.12)}
.sev.medio{color:var(--medio);border-color:rgba(224,182,92,.4);background:rgba(224,182,92,.12)}
.sev.ok{color:var(--ok);border-color:rgba(95,181,140,.4);background:rgba(95,181,140,.12)}
.find .ft{font-weight:600}
.find q{display:block;margin:9px 0;padding:8px 11px;border-left:2px solid var(--line);color:var(--gray);font-style:italic;font-size:13px}
.find .why{font-size:13px;color:var(--gray)}
.sugg{margin-top:11px;background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:11px}
.sugg .sl{font:600 11px "Inter";letter-spacing:.08em;text-transform:uppercase;color:var(--orange)}
.sugg.note-ok .sl{color:var(--ok)}
.sugg p{margin:5px 0 0;font-size:13px}
.sugg .sa{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.state{font:600 12px "Inter";padding:3px 9px;border-radius:30px}
.state.apr{color:var(--ok);background:rgba(95,181,140,.14)}.state.rej{color:var(--alto);background:rgba(240,98,90,.14)}
.find.rej{opacity:.6}

/* composer */
.composer{border-top:1px solid var(--line);padding:14px 20px calc(16px + env(safe-area-inset-bottom,0px));padding-bottom:16px}
.cwrap{max-width:760px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 10px 10px 16px;display:flex;align-items:flex-end;gap:10px;transition:border-color .2s}
.cwrap:focus-within{border-color:var(--orange)}
#input{flex:1;min-width:0;border:0;background:none;color:var(--ink);font:400 14.5px/1.5 "Inter";resize:none;max-height:180px;padding:7px 0}
#input:focus{outline:0}
#send{flex:none;width:40px;height:40px;border-radius:11px;background:var(--orange-deep);border:0;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center}
#send:disabled{opacity:.4;cursor:default}
.chint{max-width:760px;margin:8px auto 0;text-align:center;font-size:12px;color:var(--gray)}

/* drawer regras */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;display:none}
.overlay.open{display:block}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(440px,92vw);background:var(--panel);border-left:1px solid var(--line);z-index:70;transform:translateX(100%);transition:.25s;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.drawer.open{transform:none}
.drawer .dh{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.drawer .dh h2{font-size:18px;flex:1}
.drawer .db{flex:1;overflow-y:auto;padding:16px 18px}
.rule{border:1px solid var(--line);border-radius:11px;padding:11px 12px;margin-bottom:9px;background:var(--card2)}
.rule.off{opacity:.5}
.rule .rh{display:flex;align-items:center;gap:10px}
.rule .rh .nm{font-weight:600;font-size:14px;flex:1;min-width:0}
.sw{position:relative;width:38px;height:22px;flex:none;cursor:pointer}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw i{position:absolute;inset:0;background:var(--line);border-radius:30px;transition:.2s}
.sw i::before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.sw input:checked+i{background:var(--orange-deep)}.sw input:checked+i::before{transform:translateX(16px)}
.rdet{margin-top:9px;font-size:12.5px;color:var(--gray);display:none}
.rule.open .rdet{display:block}.rdet div{margin-top:5px}.rdet b{color:var(--ink);font-weight:500}
.rtoggle{background:none;border:0;color:var(--orange);font:500 12px "Inter";cursor:pointer;padding:6px 0 0}
.field{margin:8px 0}.field label{display:block;font-size:12px;color:var(--gray);margin-bottom:3px}
.field input,.field select,.field textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);font:400 13px "Inter"}
.field textarea{min-height:50px;resize:vertical}
.tpl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:9px}
.tpl select,.tpl input{flex:1 1 130px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);font:400 13px "Inter"}
.sec-ttl{font:600 12px "Inter";letter-spacing:.06em;text-transform:uppercase;color:var(--gray);margin:18px 0 8px}

@media (max-width:760px){
  .side{position:fixed;z-index:65;height:100%;transform:translateX(-100%);transition:.25s}
  .app.nav-open .side{transform:none}
  .menu-btn{display:flex}
}
</style>
</head>
<body>

<div class="app" id="app">
  <aside class="side" id="side">
    <div class="side-top">
      <a class="logo" href="index.html">Clausa<svg class="scales" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="M7 21h10"/><path d="M12 3v18"/><path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2"/></svg></a>
      <button class="btn" id="new">+ Novo contrato</button>
    </div>
    <div class="convos" id="convos"></div>
    <div class="side-foot">
      <div class="side-acct" id="account"></div>
      <button id="openrules">⚙️ Regras & modelos</button>
      <a href="index.html">↗ Voltar ao site</a>
    </div>
  </aside>

  <main class="main">
    <div class="main-top">
      <button class="menu-btn" id="menu" aria-label="Menu">☰</button>
      <span class="mt" id="mtitle">Clausa</span>
    </div>
    <div class="scroll" id="scroll"><div class="inner" id="inner"></div></div>
    <div class="composer">
      <div class="cwrap">
        <textarea id="input" rows="1" placeholder="Cole o contrato aqui…"></textarea>
        <button id="send" aria-label="Analisar"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
      </div>
      <div class="chint">A Clausa aponta os riscos; você aprova cada sugestão. · <b>Enter</b> envia, <b>Shift+Enter</b> quebra linha.</div>
    </div>
  </main>
</div>

<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawer">
  <div class="dh"><h2>Regras &amp; modelos</h2><button class="btn ghost sm" id="closedrawer">Fechar</button></div>
  <div class="db">
    <p class="mut small" style="margin:0 0 12px">Ligue, desligue, edite ou crie as regras que a Clausa procura em cada contrato.</p>
    <div id="rules"></div>
    <button class="btn ghost sm" id="addrule" style="width:100%">+ Nova regra</button>
    <div class="sec-ttl">Modelos reutilizáveis</div>
    <div class="tpl"><select id="tpls"><option value="">— modelos salvos —</option></select><button class="btn sm" id="loadtpl">Carregar</button><button class="btn ghost sm" id="deltpl">Excluir</button></div>
    <div class="tpl"><input id="tplname" placeholder="Nome do novo modelo"><button class="btn sm" id="savetpl">Salvar</button></div>
    <button class="btn ghost tiny" id="resetrules" style="margin-top:12px">Restaurar regras padrão</button>
  </div>
</aside>

<script>
(function(){
  var NAME=""; // nome exibido na saudação (preenchido quando o usuário está logado)
  var $=function(s,c){return [].slice.call((c||document).querySelectorAll(s))};
  var byId=function(i){return document.getElementById(i)};
  var LB={alto:"Risco alto",medio:"Atenção",ok:"Sem alerta"};
  var LABELS={urgente:{t:"Urgente",c:"#F0625A"},importante:{t:"Importante",c:"#E0B65C"},tranquilo:{t:"Não se preocupe",c:"#5FB58C"}};
  var SCALES='<svg class="scales" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="M7 21h10"/><path d="M12 3v18"/><path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2"/></svg>';
  var DOC='<svg class="ci" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>';
  var QUILL='<svg class="quill" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.24 12.24a6 6 0 0 0-8.49-8.49L5 10.5V19h8.5z"/><path d="M16 8 2 22"/><path d="M17.5 15H9"/></svg>';
  function greetings(){var n=NAME?(", "+NAME):"";return ["O que temos hoje"+n+"?","Qual o novo contrato"+n+"?","Vamos revisar algo"+n+"?","Por onde começamos"+n+"?"];}

  var DEFAULTS=[
    {id:"r1",on:true,sev:"alto",name:"Multa e cláusula penal",pat:"multa|penalidade|cl[áa]usula penal",reason:"Penalidades podem ser elevadas; confira o percentual, a base de cálculo e a proporcionalidade.",sugg:"Rever o valor da multa e vinculá-la à gravidade do descumprimento, evitando percentuais sobre o saldo total."},
    {id:"r2",on:true,sev:"medio",name:"Rescisão",pat:"rescis|resili|distrat",reason:"Verifique as hipóteses de rescisão, prazos de aviso e consequências para cada parte.",sugg:"Equilibrar as hipóteses de rescisão entre as partes e prever prazo de aviso razoável."},

  function cloudSync(){
    if(!user||!sb||!convos.length)return;
    clearTimeout(syncTimer);
    syncTimer=setTimeout(function(){
      sb.from("contracts").upsert(convos.map(toRow)).then(function(r){
        if(r.error){ // colunas novas talvez ainda não existam — salva o básico
          sb.from("contracts").upsert(convos.map(toRowBasic)).then(function(r2){if(r2.error)console.log("Sync (salvar) erro:",r2.error)});
        }

    },500);

  function getConvo(id){for(var i=0;i<convos.length;i++)if(convos[i].id===id)return convos[i];return null}

  // ---------- Análise ----------
  function computeFindings(text){
    var sents=text.match(/[^.;\n]+[.;]?/g)||[],found=[];
    rules.forEach(function(r){
      if(!r.on||!r.pat)return;
      var re;try{re=new RegExp(r.pat,"i")}catch(e){return}
      if(!re.test(text))return;
      var hit="";
      for(var i=0;i<sents.length;i++){var s=sents[i].trim();if(s.length>=8&&re.test(s)){hit=s;break}}
      if(!hit){var idx=text.search(re);hit=text.slice(Math.max(0,idx-30),idx+140).replace(/\s+/g," ").trim()}
      found.push({sev:r.sev,name:r.name,reason:r.reason,sugg:r.sugg,s:hit});
    });
    found.sort(function(a,b){var o={alto:0,medio:1,ok:2};return o[a.sev]-o[b.sev]});
    return found;
  }

      d.innerHTML=DOC+dot+'<span class="ct">'+esc(c.title||"Sem título")+'</span>'+pin+'<button class="cmenu" title="Opções">⋯</button>';

  function aiScales(){return SCALES.replace('class="scales"','class="scales" style="width:18px;height:18px"')}
  function appendAssistant(inner,c,typeIt){
    var found=computeFindings(c.text);
    var ma=el("div","msg");
    var head='<div class="ava ai">'+aiScales()+'</div>';
    if(!found.length){
      var ativas=rules.filter(function(r){return r.on}).length;

        ? "As regras de revisão não estão carregadas. Abra “Regras & modelos” e clique em “Restaurar regras padrão”, depois envie o contrato novamente."
        : "Revisei o documento e não encontrei pontos de atenção com as regras atuais. Pode ser que esteja tudo tranquilo — ou que o texto use termos diferentes dos que as regras procuram. Você pode ajustar as regras em “Regras & modelos”.";
      ma.innerHTML=head+'<div class="mbody"><div class="mname">Clausa</div><p class="mut" id="typ"></p></div>';
      inner.appendChild(ma);

    found.forEach(function(f,i){
      var dec=c.decisions[i];
      var block='<div class="find '+f.sev+(dec==="rej"?" rej":"")+'" id="find'+i+'"><div class="fh"><span class="sev '+f.sev+'">'+LB[f.sev]+'</span><span class="ft">'+esc(f.name)+'</span></div>'+
        '<q>'+esc(f.s.length>260?f.s.slice(0,260)+"…":f.s)+'</q><div class="why">'+esc(f.reason)+'</div>';
      if(f.sugg){
        if(f.sev==="ok"){
          block+='<div class="sugg note-ok"><span class="sl">Observação</span><p>'+esc(f.sugg)+'</p></div>';
        }else{
          block+='<div class="sugg"><span class="sl">Sugestão de melhoria</span><p>'+esc(f.sugg)+'</p><div class="sa"><button class="btn sm" data-apr="'+i+'">Aprovar</button><button class="btn ghost sm" data-rej="'+i+'">Rejeitar</button><span class="state '+(dec||"")+'" data-st="'+i+'" '+(dec?"":"hidden")+'>'+(dec==="apr"?"✓ Aprovada":dec==="rej"?"✕ Rejeitada":"")+'</span></div></div>';
        }
      }
      block+='</div>';
      rest+=block;
    });
    rest+='<div class="reprow" style="margin-top:4px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn ghost sm" id="rep">Copiar relatório</button><button class="btn ghost sm" id="dl">Baixar relatório (.txt)</button></div></div>';
    ma.innerHTML=head+'<div class="mbody"><div class="mname">Clausa</div><p id="typ" style="margin:0 0 12px"></p>'+rest+'</div>';
    inner.appendChild(ma);
    $("[data-apr]",inner).forEach(function(b){b.onclick=function(){decide(found,+b.dataset.apr,"apr")}});
    $("[data-rej]",inner).forEach(function(b){b.onclick=function(){decide(found,+b.dataset.rej,"rej")}});
    byId("rep").onclick=function(){copyReport(c,found)};
    var dlb=byId("dl");if(dlb)dlb.onclick=function(){downloadReport(c,found)};
    updateApr(c);
    typeWords(byId("typ"),"Revisei o contrato e encontrei "+found.length+" ponto(s) para a sua atenção:",typeIt,function(){var r=byId("rest");if(r)r.classList.add("show");byId("scroll").scrollTop=byId("scroll").scrollHeight});
  }
  function typeWords(elm,text,typeIt,done){
    if(!elm){if(done)done();return}
    if(!typeIt||!matchMedia("(prefers-reduced-motion: no-preference)").matches){elm.textContent=text;if(done)done();return}
    var words=text.split(" "),i=0;elm.textContent="";
    var timer=setInterval(function(){elm.textContent+=(i?" ":"")+words[i];i++;byId("scroll").scrollTop=byId("scroll").scrollHeight;if(i>=words.length){clearInterval(timer);if(done)done()}},42);
  }
  function decide(found,i,v){
    var c=getConvo(current);c.decisions[i]=v;persistConvos();
    var st=document.querySelector('[data-st="'+i+'"]');st.hidden=false;st.className="state "+v;st.textContent=v==="apr"?"✓ Aprovada":"✕ Rejeitada";
    byId("find"+i).classList.toggle("rej",v==="rej");
    updateApr(c);
  }
  function updateApr(c){var n=0;for(var k in c.decisions)if(c.decisions[k]==="apr")n++;var e=byId("aprn");if(e)e.textContent=n}

  function buildReport(c,found){
    var cnt={alto:0,medio:0,ok:0},apr=0;found.forEach(function(f,i){cnt[f.sev]++;if(c.decisions[i]==="apr")apr++});
    var lines=["RELATÓRIO DE REVISÃO — CLAUSA","Contrato: "+(c.title||""),"Gerado em "+new Date().toLocaleString("pt-BR"),"",
      "RESUMO: "+cnt.alto+" risco(s) alto(s) · "+cnt.medio+" ponto(s) de atenção · "+cnt.ok+" sem alerta · "+apr+" sugestão(ões) aprovada(s)",
      "----------------------------------------",""];
    found.forEach(function(f,i){var d=c.decisions[i];
      lines.push("["+LB[f.sev].toUpperCase()+"] "+f.name);
      lines.push("Trecho: "+f.s.trim());lines.push("Motivo: "+f.reason);
      if(f.sugg)lines.push("Sugestão: "+f.sugg+"  ->  "+(d==="apr"?"APROVADA":d==="rej"?"REJEITADA":"pendente"));
      lines.push("");
    });
    lines.push("— A Clausa aponta os riscos; a decisão é sempre do advogado.");
    return lines.join("\n");
  }
  function copyReport(c,found){
    var txt=buildReport(c,found);
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(function(){toast("Relatório copiado!")},function(){alert(txt)});
    else alert(txt);
  }
  function downloadReport(c,found){
    var txt=buildReport(c,found);
    var blob=new Blob([txt],{type:"text/plain;charset=utf-8"});
    var nm=(c.title||"revisao").replace(/[^\wÀ-ſ -]/g,"").trim().slice(0,40)||"revisao";
    var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="Clausa - "+nm+".txt";
    document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},120);
  }
  function toast(m){var t=byId("rep");if(!t)return;var o=t.textContent;t.textContent=m;setTimeout(function(){t.textContent=o},2000)}

  // ---------- Enviar ----------
  function send(){
    var v=byId("input").value.trim();if(v.length<10)return;
    var c=current?getConvo(current):null;
    if(!c){c={id:uid(),title:"",text:"",decisions:{},pinned:false,label:null,created:Date.now()};convos.unshift(c);current=c.id}
    c.text=v;c.decisions={};
    var first=(v.split("\n")[0]||"").trim();c.title=(first.length>42?first.slice(0,42)+"…":first)||("Contrato "+new Date().toLocaleDateString("pt-BR"));
    byId("input").value="";sizeInput();persistConvos();renderSidebar();renderMain(true);
  }
  function sizeInput(){var t=byId("input");t.style.height="auto";t.style.height=Math.min(t.scrollHeight,180)+"px"}

  // ---------- Regras (drawer) ----------
  function renderRules(){
    var box=byId("rules");box.innerHTML="";
    rules.forEach(function(r,i){
      var d=el("div","rule"+(r.on?"":" off"));
      d.innerHTML='<div class="rh"><label class="sw"><input type="checkbox" '+(r.on?"checked":"")+' data-t="'+i+'"><i></i></label><span class="nm">'+esc(r.name)+'</span><span class="sev '+r.sev+'">'+LB[r.sev]+'</span></div>'+
        '<div class="rdet"><div><b>Motivo:</b> '+esc(r.reason)+'</div><div><b>Sugestão:</b> '+esc(r.sugg)+'</div><div style="margin-top:8px;display:flex;gap:8px"><button class="btn ghost tiny" data-edit="'+i+'">Editar</button><button class="btn ghost tiny" data-del="'+i+'">Excluir</button></div></div>'+
        '<button class="rtoggle" data-o="'+i+'">detalhes ▾</button>';
      box.appendChild(d);
    });
    $("input[data-t]",box).forEach(function(c){c.onchange=function(){rules[+c.dataset.t].on=c.checked;persistRules();renderRules();if(current)renderMain()}});
    $("[data-o]",box).forEach(function(b){b.onclick=function(){b.parentNode.classList.toggle("open")}});
    $("[data-edit]",box).forEach(function(b){b.onclick=function(){editRule(+b.dataset.edit)}});
    $("[data-del]",box).forEach(function(b){b.onclick=function(){rules.splice(+b.dataset.del,1);persistRules();renderRules();if(current)renderMain()}});
  }
  function sel(a,b){return a===b?" selected":""}
  function editRule(i){
    var isNew=(i<0),r=isNew?{id:"r"+Date.now(),on:true,sev:"medio",name:"",pat:"",reason:"",sugg:""}:rules[i];
    var box=byId("rules"),f=el("div","rule open");
    f.innerHTML='<div class="field"><label>Nome</label><input id="f-name" value="'+esc(r.name)+'"></div>'+
      '<div class="field"><label>Nível</label><select id="f-sev"><option value="alto"'+sel(r.sev,"alto")+'>Risco alto</option><option value="medio"'+sel(r.sev,"medio")+'>Atenção</option><option value="ok"'+sel(r.sev,"ok")+'>Sem alerta</option></select></div>'+
      '<div class="field"><label>Palavras-chave (separe por | )</label><input id="f-pat" value="'+esc(r.pat)+'"></div>'+
      '<div class="field"><label>Motivo</label><textarea id="f-reason">'+esc(r.reason)+'</textarea></div>'+
      '<div class="field"><label>Sugestão de melhoria</label><textarea id="f-sugg">'+esc(r.sugg)+'</textarea></div>'+
      '<div style="display:flex;gap:8px"><button class="btn sm" id="f-save">Salvar</button><button class="btn ghost sm" id="f-cancel">Cancelar</button></div>';
    box.insertBefore(f,box.firstChild);
    byId("f-save").onclick=function(){r.name=byId("f-name").value.trim()||"Regra";r.sev=byId("f-sev").value;r.pat=byId("f-pat").value.trim();r.reason=byId("f-reason").value.trim();r.sugg=byId("f-sugg").value.trim();if(isNew)rules.push(r);persistRules();renderRules();if(current)renderMain()};
    byId("f-cancel").onclick=renderRules;
  }
  function renderTpls(){var s=byId("tpls");s.innerHTML='<option value="">— modelos salvos —</option>';Object.keys(templates).forEach(function(n){var o=el("option",null,n);o.value=n;s.appendChild(o)})}

  // ---------- Eventos ----------
  byId("new").onclick=newConvo;
  byId("send").onclick=send;
  byId("input").addEventListener("input",sizeInput);
  byId("input").addEventListener("keydown",function(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}});
  document.addEventListener("change",function(e){if(e.target&&e.target.id==="file"){var f=e.target.files[0];if(!f)return;var rd=new FileReader();rd.onload=function(){byId("input").value=rd.result;sizeInput();send()};rd.readAsText(f)}});
  byId("menu").onclick=function(){byId("app").classList.toggle("nav-open")};
  function closeNav(){byId("app").classList.remove("nav-open")}
  byId("openrules").onclick=function(){byId("drawer").classList.add("open");byId("overlay").classList.add("open");renderRules();renderTpls()};
  function closeDrawer(){byId("drawer").classList.remove("open");byId("overlay").classList.remove("open")}
  byId("closedrawer").onclick=closeDrawer;byId("overlay").onclick=closeDrawer;
  byId("savetpl").onclick=function(){var n=byId("tplname").value.trim();if(!n)return;templates[n]=clone(rules);save("clausa-templates",templates);byId("tplname").value="";renderTpls()};
  byId("loadtpl").onclick=function(){var n=byId("tpls").value;if(!n||!templates[n])return;rules=clone(templates[n]);persistRules();renderRules();if(current)renderMain()};
  byId("deltpl").onclick=function(){var n=byId("tpls").value;if(!n)return;delete templates[n];save("clausa-templates",templates);renderTpls()};
  byId("resetrules").onclick=function(){rules=clone(DEFAULTS);persistRules();renderRules();if(current)renderMain()};

  // adiciona input de arquivo oculto (reaproveitado pelos botões "Carregar .txt")
  var fi=el("input");fi.type="file";fi.id="file";fi.accept=".txt,text/plain";fi.style.display="none";document.body.appendChild(fi);

  // start
  if(convos.length){current=convos[0].id}
  renderSidebar();renderMain();sizeInput();

  // conta / nuvem: se estiver logado, carrega os contratos da nuvem
  if(sb){
    sb.auth.getSession().then(function(r){
      user=(r.data&&r.data.session)?r.data.session.user:null;
      if(user)NAME=firstName(user);
      renderAccount();
      renderMain();
      if(user)loadCloud();
    });
  }else{
    renderAccount();
  }
})();
</script>
</body>
</html>
