<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@800;900&family=Inter:wght@600&family=JetBrains+Mono:wght@700&display=swap">
<style>
html,body{margin:0;width:1080px;height:1920px;background:#0B0B0C;overflow:hidden}
#bg{position:absolute;inset:0;background-size:cover;background-position:center;filter:brightness(.62) saturate(1.05)}
#grad{position:absolute;inset:0;background:linear-gradient(180deg,#0B0B0C 0%,#0B0B0C 23%,rgba(11,11,12,.6) 27%,rgba(11,11,12,0) 33%,rgba(11,11,12,0) 42%,rgba(11,11,12,.86) 66%,#0B0B0C 88%)}

#titulo{position:absolute;left:84px;right:84px;bottom:420px;font:900 124px/.98 "Inter Tight";letter-spacing:-.045em;color:#FAFAFA}

#marca{position:absolute;left:84px;bottom:296px;display:flex;align-items:center;gap:14px;font:800 40px "Inter Tight";letter-spacing:-.03em;color:#FAFAFA}
#marca svg{width:46px}
#marca span{font:600 26px Inter;color:#9B9B9E;letter-spacing:0;margin-left:10px}
</style></head><body>
<div id="bg"></div><div id="grad"></div>
<div id="selo"><i></i><span id="st"></span></div>
<div id="titulo"></div>

<script>
const q=new URLSearchParams(location.search);
document.getElementById('bg').style.backgroundImage=`url(${q.get('fundo')})`;
document.getElementById('st').textContent=q.get('selo');

</script></body></html>
