# Mantém o banco do Clausa (Supabase, plano grátis) ativo.
# O plano grátis pausa o projeto depois de alguns dias sem uso; esta tarefa faz uma consulta
# simples a cada 3 dias. A chave usada é a pública (a mesma que já está no site), e a proteção
# por linha (RLS) faz a consulta voltar vazia: nenhum dado de usuário é lido.
name: Manter banco ativo

on:
  schedule:
    - cron: "17 9 */3 * *"   # a cada 3 dias, 06:17 em Brasília
  workflow_dispatch: {}        # permite rodar na mão pela aba Actions

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Consulta simples ao banco
        env:
          SUPABASE_URL: https://vrmsbxdwuanfvkuyqqzv.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_xdhQvk60-LGISTNtlzUT7A__qvZd9dt
        run: |
          code=$(curl -s -o /tmp/r.txt -w "%{http_code}" --retry 3 --retry-delay 10 \
            "$SUPABASE_URL/rest/v1/contracts?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "Resposta do banco: HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::O banco não respondeu (HTTP $code). Pode ter sido pausado: entre no painel do Supabase e clique em Restore."
            cat /tmp/r.txt; exit 1
          fi
